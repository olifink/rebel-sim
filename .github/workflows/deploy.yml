name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; don't cancel one that's already
# uploading so Pages never gets a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/engine

      # Project page, not a user/org page — served from
      # olifink.github.io/rebel-sim/, so every asset URL and the SW's
      # index must resolve under that subpath.
      - run: npm run build --workspace=packages/app -- --base-href /rebel-sim/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist/app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
