<main class="repl">
  <canvas #screen class="screen" width="320" height="240" tabindex="0"></canvas>

  <div class="stack-bar">
    <span class="stack-label">stack (top→bottom):</span>
    <span class="stack-values">{{ stack().join(' ') || '(empty)' }}</span>
  </div>

  <div class="storage-bar">
    <span class="stack-label">storage:</span>
    <span class="storage-status">{{ storageStatus() }}</span>
  </div>
</main>
