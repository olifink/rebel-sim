<main class="repl">
  <pre class="log">{{ log() }}</pre>

  <div class="stack-bar">
    <span class="stack-label">stack (top→bottom):</span>
    <span class="stack-values">{{ stack().join(' ') || '(empty)' }}</span>
  </div>

  <form class="input-row" (submit)="$event.preventDefault(); submit()">
    <span class="prompt">&gt;</span>
    <input #input type="text" autocomplete="off" spellcheck="false" />
  </form>
</main>
